# file: 12-gateway-partners.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: partners-gw
  namespace: istio-ingress-partners
spec:
  gatewayClassName: istio
  listeners:
    - name: https-mtls
      port: 443
      protocol: HTTPS
      hostname: partners.globemart.example
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: partners-tls          # tls.crt, tls.key AND ca.crt (partner CA)
        options:
          gateway.istio.io/tls-terminate-mode: MUTUAL
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: partners
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: partner-api
  namespace: partners
spec:
  parentRefs:
    - name: partners-gw
      namespace: istio-ingress-partners
  hostnames:
    - partners.globemart.example
  rules:
    - backendRefs:
        - name: partner-api
          port: 8080
